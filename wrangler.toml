name = "pi-metrics"
main = "worker.js"
compatibility_date = "2025-01-01"

[triggers]
crons = ["* * * * *"]

[vars]
FOCUS_DAILY_WRITE_BUDGET = "85000"
FOCUS_HISTORY_WRITE_BUDGET = "5000"

# KV pra guardar a estatística de migração.
# Pegue o id em: Cloudflare > Storage & Databases > KV (id do namespace STATS)
[[kv_namespaces]]
binding = "STATS"
id = "ae3bc135dc1944d1aa17335ebf445853"

# Banco persistente do índice de migrações. Manter este binding no arquivo
# evita que deploys futuros removam o DB configurado no painel da Cloudflare.
[[d1_databases]]
binding = "DB"
database_name = "pi-migrations"
database_id = "97830d3a-8c39-462b-96ba-6181e19eab91"
